<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <div class="photos">
            <img onclick="main.src= this.src" src="images/img7.jpg.jpg" alt="...">
            <img onclick="main.src= this.src" src="images/img8.jpg.jpg" alt="...">
            <img onclick="main.src= this.src" src="images/img5.jpg.jpg" alt="...">
            <img onclick="main.src= this.src" src="images/img4.jpg.jpg" alt="...">
            

        </div>
        <div class="main">
            <img src="images/img5.jpg.jpg"  name="main" alt="...">
            
        </div>
        <div class="photos">
            <img onmouseenter="main.src= this.src" src="images/img7.jpg.jpg" alt="...">
            <img onmouseenter="main.src= this.src" src="images/img8.jpg.jpg" alt="...">
            <img onmouseenter="main.src= this.src" src="images/img5.jpg.jpg" alt="...">
            <img onmouseenter="main.src= this.src" src="images/img4.jpg.jpg" alt="...">
            

        </div>
    </div>
    
</body>
</html>
